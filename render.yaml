services:
  - type: web
    name: 3agents
    runtime: docker
    plan: free             # free plan: kept awake by an outside ping to /health every 5 min (UptimeRobot)
    region: frankfurt
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DB_PATH
        value: data/agents.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: X_CT0
        sync: false
