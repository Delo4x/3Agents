services:
  - type: web
    name: 3agents
    runtime: docker
    plan: starter          # free plan sleeps after inactivity – starter stays on 24/7
    region: frankfurt
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/agents.db
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: X_CT0
        sync: false
