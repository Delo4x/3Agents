  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bgS)"/>
  <!-- horizon -->
  <path d="M0 140 Q50 128 100 136 T200 130 V200 H0Z" fill="#0F2129" opacity=".8"/>
  <!-- hood / cloak -->
  <path d="M42 200 C44 140 60 92 100 74 C140 92 156 140 158 200Z" fill="#3E6B5B"/>
  <path d="M62 200 C64 150 76 112 100 100 C124 112 136 150 138 200Z" fill="#2E5446"/>
