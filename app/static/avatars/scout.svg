  <path d="M66 104 C70 72 86 56 100 54 C114 56 130 72 134 104 C124 88 112 82 100 82 C88 82 76 88 66 104Z" fill="#3E6B5B"/>
  <!-- binoculars -->
  <g transform="translate(100 108)">
    <rect x="-34" y="-12" width="30" height="22" rx="9" fill="#1D2B30"/>
    <rect x="4" y="-12" width="30" height="22" rx="9" fill="#1D2B30"/>
    <rect x="-6" y="-6" width="12" height="9" rx="3" fill="#1D2B30"/>
    <circle cx="-19" cy="-1" r="8" fill="#4FB3A9"/>
    <circle cx="19" cy="-1" r="8" fill="#4FB3A9"/>
    <circle cx="-22" cy="-4" r="2.6" fill="#E8F6F2"/>
    <circle cx="16" cy="-4" r="2.6" fill="#E8F6F2"/>
  </g>
  <!-- mouth -->
  <path d="M92 128 Q100 133 108 128" stroke="#7A5236" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- hands -->
  <ellipse cx="70" cy="122" rx="9" ry="7" fill="#D9B48A"/>
  <ellipse cx="130" cy="122" rx="9" ry="7" fill="#D9B48A"/>
  <!-- star -->
  <path d="M154 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#D9A441"/>
